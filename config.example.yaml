# Minimal CLIProxyAPI configuration for the cliproxyapi-opencode-provider plugin.
# Copy to config.yaml next to the CLIProxyAPI binary and replace every placeholder.
# Never commit real client keys, upstream keys or management secrets.
config-version: 8
server:
  host: "127.0.0.1"
  port: 8317
# Local management API. Remote access stays off and the bundled control panel is
# disabled; the plugin UI is served from the management/resource routes instead.
management:
  allow-remote: false
  secret-key: "replace-with-management-password"
  disable-control-panel: true
# Keys clients use against this proxy (not OpenCode upstream keys).
access:
  api-keys:
    - "replace-with-client-api-key"
# CPA owns credential storage. Keys imported through the plugin UI are persisted
# under auth-dir by the host and are never written to this file or the plugin YAML.
oauth:
  auth-dir: "./auths"
routing:
  strategy: "round-robin"
  session-affinity: true
  session-affinity-ttl: "1h"
  retry:
    request-retry: 3
    max-retry-credentials: 0
    max-retry-interval: 30
plugins:
  enabled: true
  dir: "./plugins"
  # Add this source, then install OpenCode Go from the CPA plugin store.
  store-sources:
    - "https://raw.githubusercontent.com/fengwk/cliproxyapi-opencode-provider/main/registry.json"
  configs:
    cliproxyapi-opencode-provider:
      enabled: true
      # OpenCode Go upstream endpoint.
      base-url: "https://opencode.ai/zen/go/v1"
      # Optional protocol route overrides. These do NOT register models: the
      # published catalog comes from the authenticated upstream GET
      # <base-url>/models plus any explicit manual-models below.
      # protocol is one of: openai, claude, openai-response.
      # models:
      #   - id: "custom-model"
      #     protocol: "openai"
      # Explicitly registered models, published under the opencode-go/ prefix and
      # usable even when upstream discovery fails. Known families may omit
      # protocol; unknown families require it. At most 100 entries, each id at
      # most 200 bytes; official catalog metadata wins for duplicate ids.
      # manual-models:
      #   - id: "glm-5.2"
      #   - id: "novel-model"
      #     protocol: "claude"

# Native library location (see `make build` and the release archives):
#   <plugins.dir>/<goos>/<goarch>/cliproxyapi-opencode-provider.so
# Install the library as cliproxyapi-opencode-provider.so / .dylib / .dll.
#
# Key import UI and endpoint exposed by the plugin:
#   GET  /v0/resource/plugins/cliproxyapi-opencode-provider/ui
#   POST /v0/management/plugins/cliproxyapi-opencode-provider/keys
#
# Read-only quota is available in the plugin UI without extra configuration.
# Native CPA management endpoints (all require the management key):
#   GET  /v0/management/quota/providers
#   POST /v0/management/plugins/cliproxyapi-opencode-provider/quota
# Body: {"auth_index":"<index from the plugin keys list>"}
# The stock management panel needs generic plugin quota support to display it.
